# Sofle OLED display, driven by the zmk-nice-oled module (vertical status
# screen). The nice_oled shield's Kconfig.defconfig already forces the custom
# status screen and display infra; we set it explicitly for clarity and then
# pare the widget set down to a minimal vertical stack:
#   output/connectivity glyph + battery%  (NICE_OLED_WIDGET_STATUS)
#   layer name                            (NICE_OLED_WIDGET_LAYER)
# The built-in CONFIG_ZMK_WIDGET_* flags no longer apply (custom screen).
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# --- Central (left) widgets ---
# Status (output/connectivity + battery) and layer name stay on (default y).
# Add modifier indicators; leave WPM and lock-key (HID) indicators off.
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_WPM=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n

# --- Raw-HID widgets (central screen only) ---
# These only show live data with the zmk-hid-host companion app running on the
# computer. Keeping time + volume; layout/weather/Spotify dropped.
CONFIG_NICE_OLED_WIDGET_RAW_HID=y
CONFIG_NICE_OLED_WIDGET_RAW_HID_TIME=y
CONFIG_NICE_OLED_WIDGET_RAW_HID_VOLUME=y
CONFIG_NICE_OLED_WIDGET_RAW_HID_LAYOUT=n

# --- Peripheral (right) half ---
# No animations. Instead, surface the right half's battery on the central
# screen alongside the central battery (no animation, low cost).
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_CENTRAL_SHOW_BATTERY_PERIPHERAL_ALL=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment this line below to add rgb underglow / backlight support
CONFIG_ZMK_RGB_UNDERGLOW=y
#CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
#CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=0
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0


# Uncomment thisline belowto enable ZMK Studio 
CONFIG_ZMK_STUDIO=y

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

#Mouse Pointer Configuration
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n


# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
